protocol: cube-planner-study-v1
# Set through --inputs (an existing cube-local.yaml) or CLI overrides.
dataset: null
weights: null
device: auto
render_backend: auto
sensors: rgb
action_dim: 5
action_block: 5
image_size: 224
goal_offset: 25
total_steps: 50
success_distance_m: 0.04
horizon: 5
execute_blocks: 1
cem_samples: 300
cem_iterations: 10
cem_elites: 30
score_batch_size: 64
environment_seed: 1234
split_seed: 20261119
train_episodes: 64
dev_episodes: 16
test_episodes: 64
# Search offline metadata only; no donor pixels are used to train the heads.
donor_episodes: 2048
dev_cases: 12
mechanism_cases: 12
dev_seeds: [42, 43]
test_seeds: [142, 143, 144]
bootstrap_seed: 99
pairing:
  frame_stride: 5
  max_per_label: 2048
  positive_m: 0.005
  negative_m: 0.06
  hard_max_m: 0.10
  # Joint angle RMS and gripper opening are normalized by these units before
  # thresholding. One unit is 0.15 rad RMS joint motion or 0.10 opening change.
  joint_unit_rad: 0.15
  gripper_unit: 0.10
  min_positive_robot: 1.0
  max_negative_robot: 1.0
training:
  rank: 4
  hidden: 256
  radius_quantile: 0.9
  steps: 2000
  batch_size: 128
  learning_rate: 0.0003
  margin: 1.0
  negative_weight: 1.0
  projector_weight: 0.01
  seed: 2718
  cpu_threads: 2
